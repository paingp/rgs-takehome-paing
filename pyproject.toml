[project]
name = "symbol-spotter"
version = "0.1.0"
description = "Symbol detection for construction takeoff: select a symbol on a drawing, count every instance of it."
requires-python = ">=3.14"
dependencies = [
    "pymupdf==1.28.2",
    "opencv-python-headless==5.0.0.93",
    "numpy==2.5.2",
    "pillow==12.3.0",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx2==2.12.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["takeoff", "server", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# `pytest -m smoke` is what install.ps1 / install.sh run: it answers "is the install correct",
# which is a different question from "is the detector accurate". The rest of the suite runs
# real detection over whole 78-megapixel sheets and takes about twenty minutes; that belongs in
# a deliberate `pytest` run, not in a setup script.
markers = [
    "smoke: proves the install works. No accuracy claims, no full-sheet detection.",
]
